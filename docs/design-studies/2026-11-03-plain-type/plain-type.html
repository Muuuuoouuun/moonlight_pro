<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moonlight Plain</title>
<style>
/* Moonlight Plain — A안(영역 구역) 확정 뒤 전체 목업.
   글꼴 하나(SUIT), 색 셋(글자 · 보조 · 흐림), 구역 선 하나. 면 · 그림자 · 아이콘 · 배지 없음.
   레이아웃: 왼쪽 글자 내비 168px | 본문 최대 760px. 위계는 크기 · 굵기 · 간격 · 정렬로만. */
@font-face {
  font-family: 'SUIT Variable';
  src: url('../../../apps/hub/public/fonts/SUIT-Variable.woff2') format('woff2');
  font-weight: 100 900;
  font-display: swap;
}
:root {
  --bg: oklch(0.992 0.002 250);
  --fg: oklch(0.19 0.008 250);
  --fg-2: oklch(0.42 0.008 250);
  --fg-3: oklch(0.52 0.007 250);
  --danger: oklch(0.53 0.19 27);
  --input: oklch(0.70 0.006 250);
  --line: oklch(0.905 0.004 250);

  --font: 'SUIT Variable', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;

  /* 위계 6단 */
  --t1: 56px;  /* 페이지 제목 · 200 */
  --t2: 40px;  /* 큰 숫자 · 250 */
  --t3: 22px;  /* 구역 · 영역 이름 · 700 */
  --t4: 17px;  /* 항목 · 500 */
  --t5: 14px;  /* 보조 · 400 */
  --t6: 13px;  /* 라벨 · 600 */

  /* 간격 4단 */
  --s1: 8px; --s2: 16px; --s3: 32px; --s4: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.165 0.004 250); --fg: oklch(0.94 0.004 250); --fg-2: oklch(0.76 0.007 250);
    --fg-3: oklch(0.65 0.008 250); --danger: oklch(0.72 0.15 27); --input: oklch(0.48 0.008 250); --line: oklch(0.29 0.006 250);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.165 0.004 250); --fg: oklch(0.94 0.004 250); --fg-2: oklch(0.76 0.007 250);
  --fg-3: oklch(0.65 0.008 250); --danger: oklch(0.72 0.15 27); --input: oklch(0.48 0.008 250); --line: oklch(0.29 0.006 250);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: var(--t4); line-height: 1.55;
  font-feature-settings: 'tnum'; word-break: keep-all; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
a { color: inherit; }
:focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }

.shell {
  display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: var(--s4);
  max-width: 1160px; margin: 0 auto; padding-block: var(--s4);
  padding-left: max(40px, env(safe-area-inset-left, 0px));
  padding-right: max(40px, env(safe-area-inset-right, 0px));
}

/* 내비 — 글자만. 현재 위치는 굵기와 진하기 */
.nav { display: flex; flex-direction: column; gap: var(--s3); position: sticky; top: calc(var(--s4) + env(safe-area-inset-top, 0px)); align-self: start; }
.brand { font-weight: 700; letter-spacing: -0.01em; text-decoration: none; }
.nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav ul a { display: block; padding-block: 5px; color: var(--fg-3); text-decoration: none; }
.nav ul a:hover { color: var(--fg); }
.nav ul a[aria-current="page"] { color: var(--fg); font-weight: 700; }
.nav .meta { display: flex; flex-direction: column; gap: 6px; font-size: var(--t5); color: var(--fg-3); }
.link { font-size: var(--t5); color: var(--fg-2); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

main { min-width: 0; max-width: 760px; }
.view { display: flex; flex-direction: column; gap: var(--s4); }
.view > .top { display: flex; flex-direction: column; gap: var(--s3); }

/* 탭 — 하위 목적지. 굵기로만 현재를 말한다 */
.tabs { display: flex; flex-wrap: wrap; gap: 4px var(--s3); }
.tabs a { font-size: var(--t4); color: var(--fg-3); text-decoration: none; padding-block: 4px; }
.tabs a:hover { color: var(--fg); }
.tabs a[aria-current="page"] { color: var(--fg); font-weight: 700; }

.head { display: flex; flex-direction: column; gap: var(--s1); }
.label { font-size: var(--t6); font-weight: 600; color: var(--fg-3); letter-spacing: 0.02em; }
h1 { margin: 0; font-size: var(--t1); font-weight: 200; letter-spacing: -0.035em; line-height: 1.15; text-wrap: balance; }
.lead { margin: 0; color: var(--fg-2); }
.lead b { color: var(--fg); font-weight: 600; }
.back { font-size: var(--t5); color: var(--fg-2); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; align-self: flex-start; }

/* 입력 — 밑줄 하나 */
.capture { display: block; width: 100%; font: inherit; font-size: 17px; color: var(--fg);
  background: none; border: 0; border-bottom: 1px solid var(--input); border-radius: 0; padding: 10px 0; }
.capture::placeholder { color: var(--fg-3); }
.capture:focus-visible { outline: none; border-bottom-color: var(--fg); }
.capture.title { font-size: var(--t3); font-weight: 700; }
.writer { display: block; width: 100%; min-height: 320px; resize: vertical; font: inherit; font-size: 17px; line-height: 1.8;
  color: var(--fg); background: none; border: 0; padding: 0; }
.writer::placeholder { color: var(--fg-3); }
.writer:focus-visible { outline: none; }
.add { display: flex; flex-direction: column; gap: 6px; }
.parse, .status { min-height: 22px; font-size: var(--t5); color: var(--fg-2); display: flex; flex-wrap: wrap; gap: var(--s1); align-items: baseline; }
.parse b { color: var(--fg); font-weight: 700; }
.status button { font-weight: 600; color: var(--fg); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.keys { font-size: var(--t6); color: var(--fg-3); font-weight: 600; letter-spacing: 0.02em; }

/* 구역 — 머리 위 옅은 1px 하나. 구역 이름은 굵게 */
section { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 20px; }
.groups { display: flex; flex-direction: column; gap: 40px; }
h2 { margin: 0 0 var(--s1); font-size: var(--t3); font-weight: 700; letter-spacing: -0.01em; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
h2 .n { font-weight: 400; color: var(--fg-3); font-size: var(--t4); }
h2 .hint { font-size: var(--t5); font-weight: 400; color: var(--fg-2); }
h2 .right { margin-left: auto; font-size: var(--t5); font-weight: 400; }

/* 행: 왼쪽 칸 · 본문 · 오른쪽 값 */
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; column-gap: var(--s2); align-items: baseline; padding-block: 9px; }
.rows.tight .row { grid-template-columns: 32px minmax(0, 1fr) auto; column-gap: 14px; }
.rows.flat .row { grid-template-columns: minmax(0, 1fr) auto; }
.rows.flat .row .k { display: none; }
.row .k { font-size: var(--t5); color: var(--fg-3); }
.row .t { font-weight: 500; min-width: 0; }
.row .sub { display: block; font-size: var(--t5); font-weight: 400; color: var(--fg-2); margin-top: 2px; }
.sub b, .area-in { color: var(--fg); font-weight: 700; }
.row .v { font-size: var(--t5); color: var(--fg-2); text-align: right; white-space: nowrap; display: flex; gap: 12px; justify-content: flex-end; align-items: baseline; }
.row .v strong { font-size: var(--t4); font-weight: 600; color: var(--fg); }
.row.past .t, .row.past .k, .row.past .v { color: var(--fg-3); font-weight: 400; }
.row.done .t, .row.done .sub { color: var(--fg-3); font-weight: 400; }
.row.done .chk { color: var(--fg); font-weight: 700; }
.late { color: var(--danger) !important; font-weight: 600; }
a.row { text-decoration: none; color: inherit; }
a.row:hover .t { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }

.chk { font-size: var(--t4); color: var(--fg-2); width: 32px; min-height: 26px; }
.act { font-size: var(--t5); color: var(--fg); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; white-space: nowrap; }
.more { font-size: var(--t5); color: var(--fg-2); padding-block: 8px; }
.more b { color: var(--fg); }

/* 큰 숫자 */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3) var(--s2); }
.stats.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stat { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .num { font-size: var(--t2); font-weight: 250; letter-spacing: -0.02em; line-height: 1.1; }
.stat .of { font-size: var(--t5); color: var(--fg-2); }

/* 이름 — 값 줄 (설정 · 상세 요약) */
.kv { display: grid; grid-template-columns: 160px minmax(0, 1fr); column-gap: var(--s2); row-gap: 12px; margin: 0; }
.kv dt { font-size: var(--t5); color: var(--fg-3); }
.kv dd { margin: 0; font-weight: 500; }
.kv dd .sub { display: block; font-size: var(--t5); color: var(--fg-2); font-weight: 400; }

/* 글자 고르기 (에너지 · 보기) */
.choices { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); }
.choices button { color: var(--fg-3); font-size: var(--t4); padding-block: 6px; }
.choices button[aria-pressed="true"] { color: var(--fg); font-weight: 700; text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }
.p { margin: 0; max-width: 62ch; }
.p.dim { color: var(--fg-2); font-size: var(--t5); }
.quote { margin: 0; font-size: var(--t3); font-weight: 300; letter-spacing: -0.01em; line-height: 1.5; max-width: 34ch; }

/* 위계표 */
.spec { display: flex; flex-direction: column; gap: var(--s3); }
.spec-row { display: grid; grid-template-columns: 140px minmax(0, 1fr); column-gap: var(--s2); align-items: baseline; }
.spec-row .k { font-size: var(--t5); color: var(--fg-3); }

@media (max-width: 760px) {
  :root { --t2: 34px; --t3: 20px; }
  .shell { grid-template-columns: minmax(0, 1fr); gap: var(--s3); padding-block: var(--s3);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .nav { position: static; gap: var(--s2); }
  .nav ul { flex-direction: row; gap: var(--s2); overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .nav ul a { white-space: nowrap; padding-block: 10px; }
  .nav .meta { flex-direction: row; flex-wrap: wrap; gap: var(--s2); }
  h1 { font-size: 38px; }
  .view { gap: var(--s3); }
  .row { grid-template-columns: 48px minmax(0, 1fr) auto; column-gap: 12px; padding-block: 10px; }
  .rows.tight .row { grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; padding-block: 2px; }
  .chk { min-height: 44px; width: 44px; margin-left: -8px; padding-left: 8px; }
  .stats, .stats.four { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); }
  .kv, .spec-row { grid-template-columns: minmax(0, 1fr); row-gap: 4px; }
  .kv dd { margin-bottom: 10px; }
  .tabs a { padding-block: 10px; }
  .keys { display: none; }
}
@media (hover: none) and (pointer: coarse) { .keys { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="주요 메뉴">
    <a class="brand" href="#home">Moonlight</a>
    <ul id="primary"></ul>
    <ul id="utility"></ul>
    <div class="meta">
      <span>예시 값 · 목업</span>
      <button type="button" class="link" id="theme">다크로 보기</button>
    </div>
  </nav>
  <main id="main"></main>
</div>

<script>
(() => {
  // ───────────────── 공통 ─────────────────
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const AREAS = ['회사', '영업', '콘텐츠', '제품', '개인', '분류 전'];
  const DAY = ['일', '월', '화', '수', '목', '금', '토'];
  const TODAY_DOW = 3;                    // 11월 4일 수요일
  const WEEK_END = 4;                     // 일요일 11/8까지가 이번 주

  const head = (label, title, lead) =>
    `<header class="head"><span class="label">${label}</span><h1>${title}</h1>${lead ? `<p class="lead">${lead}</p>` : ''}</header>`;
  const sec = (title, n, body, extra = '') =>
    `<section><h2>${title}${n != null ? `<span class="n">${n}</span>` : ''}${extra}</h2>${body}</section>`;
  const row = ({ k = '', t, sub, v = '', cls = '', vcls = '', href }) => {
    const inner = `<span class="k">${k}</span><span class="t">${t}${sub ? `<span class="sub">${sub}</span>` : ''}</span><span class="v ${vcls}">${v}</span>`;
    return href ? `<li><a class="row ${cls}" href="${href}">${inner}</a></li>` : `<li class="row ${cls}">${inner}</li>`;
  };
  const rows = (items, cls = '') => `<ul class="rows ${cls}">${items.map(row).join('')}</ul>`;
  // A안: 영역마다 한 구역 — 구역 이름 굵게, 머리 위 옅은 선
  const byArea = (xs) => AREAS.map((a) => [a, xs.filter((x) => x.a === a)]).filter(([, g]) => g.length);
  const areaSections = (xs, toRow, hint, cls = '') => `<div class="groups">${byArea(xs).map(([a, g]) =>
    sec(a, g.length, rows(g.map(toRow), cls), hint ? `<span class="hint">${hint(g) || ''}</span>` : '')).join('')}</div>`;
  const stats = (items, four) => `<div class="stats ${four ? 'four' : ''}">${items.map(([l, n, of]) =>
    `<div class="stat"><span class="label">${l}</span><span class="num">${n}</span>${of ? `<span class="of">${of}</span>` : ''}</div>`).join('')}</div>`;
  const kv = (items) => `<dl class="kv">${items.map(([k, v, sub]) => `<dt>${k}</dt><dd>${v}${sub ? `<span class="sub">${sub}</span>` : ''}</dd>`).join('')}</dl>`;
  const act = (label) => `<button type="button" class="act" data-mock="${esc(label)}">${label}</button>`;
  const dueLabel = (d) => {
    if (d == null) return '기한 없음';
    if (d < 0) return `${-d}일 지남`;
    if (d === 0) return '오늘';
    if (d === 1) return '내일';
    if (d <= WEEK_END) return `${DAY[(TODAY_DOW + d) % 7]}요일`;
    const x = new Date(2026, 10, 4 + d);
    return `${x.getMonth() + 1}/${x.getDate()} ${DAY[x.getDay()]}`;
  };
  const dueSpan = (d) => `<span class="${d != null && d < 0 ? 'late' : ''}">${dueLabel(d)}</span>`;

  // ───────────────── 할 일 (A안) ─────────────────
  const SEED = () => ([
    { id: 1, t: '세금계산서 발행', a: '회사', p: '회계', due: -3 },
    { id: 2, t: '고객 C 회신 내용 정리', a: '영업', p: '고객 C', due: 0, imp: true, focus: 2 },
    { id: 3, t: '11월 발행 계획 확정', a: '콘텐츠', p: '콘텐츠 운영', due: 0, focus: 3 },
    { id: 4, t: '제안서 초안 보내기', a: '영업', p: '고객 A 제안', due: 0, done: true, focus: 1 },
    { id: 5, t: '강의 자료 정리', a: '콘텐츠', p: '강의 리뉴얼', due: 1 },
    { id: 6, t: '제품 소개 페이지 문구', a: '제품', p: '제품 소개 페이지', due: 2, imp: true },
    { id: 7, t: '월말 정산 준비', a: '회사', p: '회계', due: 2 },
    { id: 8, t: '브랜드 로그 정리', a: '콘텐츠', p: '브랜드', due: 3 },
    { id: 9, t: '세미나 후기 쓰기', a: '콘텐츠', p: '콘텐츠 운영', due: 5 },
    { id: 10, t: '분기 회고 메모', a: '개인', p: '', due: null },
    { id: 11, t: '랜딩 문구 실험', a: '제품', p: '제품 소개 페이지', due: null },
    { id: 12, t: '읽을거리 정리', a: '개인', p: '', due: null },
  ]);
  let tasks = SEED();
  let nextId = 100, cur = null, showDone = false, lastDone = null, statusTimer = 0, statusHtml = '';
  const lane = (x) => x.due == null ? 'later' : x.due < 0 ? 'late' : x.due === 0 ? 'today' : x.due <= WEEK_END ? 'week' : 'later';
  const open = () => tasks.filter((x) => !x.done);
  const byDue = (a, b) => (a.due ?? 999) - (b.due ?? 999) || (b.imp ? 1 : 0) - (a.imp ? 1 : 0) || a.id - b.id;

  const parse = (raw) => {
    let s = ' ' + raw.trim() + ' ';
    let due, p = '', imp = false;
    const take = (re, fn) => { const m = s.match(re); if (m) { fn(m); s = s.replace(m[0], ' '); } };
    take(/\s!\s/, () => { imp = true; });
    take(/\s#(\S+)/, (m) => { p = m[1].trim(); });
    take(/\s(오늘)\s/, () => { due = 0; });
    take(/\s(내일)\s/, () => { due = 1; });
    take(/\s(모레)\s/, () => { due = 2; });
    take(/\s(다음 ?주)\s/, () => { due = 5; });
    take(/\s(\d{1,2})\/(\d{1,2})\s/, (m) => { due = Math.round((new Date(2026, +m[1] - 1, +m[2]) - new Date(2026, 10, 4)) / 864e5); });
    take(/\s([월화수목금토일])(요일)?\s/, (m) => { due = ((DAY.indexOf(m[1]) - TODAY_DOW + 7) % 7) || 7; });
    let a = '분류 전';
    if (AREAS.includes(p)) { a = p; p = ''; }
    else if (p) { const hit = tasks.find((x) => x.p === p); a = hit ? hit.a : '분류 전'; }
    return { t: s.replace(/\s+/g, ' ').trim(), due, a, p, imp };
  };
  const chk = (x) => `<button type="button" class="chk" data-task="${x.id}" aria-pressed="${!!x.done}" aria-label="${esc(x.t)} ${x.done ? '끝냄, 되돌리기' : '끝내기'}">${x.done ? '✓' : '○'}</button>`;
  const taskSub = (x, withArea) => {
    const bits = [];
    if (x.imp) bits.push('<b>중요</b>');
    if (withArea) bits.push(`<b>${esc(x.a)}</b>`);
    if (x.p) bits.push(esc(x.p));
    return bits.length ? `<span class="sub">${bits.join(' · ')}</span>` : '';
  };
  const taskLi = (x, right, withArea) =>
    `<li class="row ${x.done ? 'done' : ''}" data-row="${x.id}">${chk(x)}<span class="t">${esc(x.t)}${taskSub(x, withArea)}</span><span class="v">${right ?? (x.done ? '끝' : dueSpan(x.due))}</span></li>`;
  const say = (html, undo) => {
    clearTimeout(statusTimer);
    statusHtml = `<span>${html}</span>${undo ? '<button type="button" id="undo">되돌리기</button>' : ''}`;
    const el = document.getElementById('status'); if (el) el.innerHTML = statusHtml;
    statusTimer = setTimeout(() => { statusHtml = ''; lastDone = null; const e = document.getElementById('status'); if (e) e.innerHTML = ''; }, 5000);
  };
  const toggleTask = (id) => {
    const x = tasks.find((t) => t.id === id);
    x.done = !x.done; cur = id;
    if (x.done) { lastDone = x; say(`‘${esc(x.t)}’ 끝`, true); } else { statusHtml = ''; }
    render(true);
  };

  // ───────────────── 화면 ─────────────────
  const V = {};

  // 홈
  V.home = () => head('홈 · 11월 4일 수요일', '확인할 것 3', '오늘 3개 중 <b>1</b>개 끝 · 다음 일정 <b>15:00</b>')
    + sec('확인할 것', 3, rows([

    { k: 'work', l: '내 작업', tabs: [['work', '실행 목록'], ['work-memos', '메모'], ['work-review', '하루 리뷰']] },
    { k: 'revenue', l: '영업·매출', tabs: [['revenue', '오늘 연락'], ['revenue-customers', '고객'], ['revenue-deals', '거래'], ['revenue-inquiries', '문의']] },
    { k: 'discovery', l: '기회 탐색' },
    { k: 'projects', l: '프로젝트' },
    { k: 'products', l: '제품', tabs: [['products', '개발'], ['products-portfolio', '포트폴리오']] },
    { k: 'brands', l: '브랜드', tabs: [['brands', '브랜드 목록'], ['brands-log', '콘텐츠 로그']] },
    { k: 'content', l: '콘텐츠', tabs: [['content', '소재·제작'], ['content-write', '원고 작성'], ['content-publish', '발행'], ['content-results', '성과']] },
  ];
  const UTIL = [
    { k: 'ai', l: 'AI·자동화', tabs: [['ai', '오피스'], ['ai-chat', '코칭·대화'], ['ai-automations', '자동화'], ['ai-runs', '실행 기록']] },
    { k: 'prefs', l: '설정' },
    { k: 'type', l: '위계표' },
  ];
  const ALL = [...NAV, ...UTIL];
  const ownerOf = (route) => route.startsWith('project-') ? ALL.find((a) => a.k === 'projects')
    : ALL.find((a) => a.k === route || (a.tabs || []).some(([t]) => t === route));

  const navHtml = (items) => items.map((a) => `<li><a href="#${a.k}" data-k="${a.k}">${a.l}</a></li>`).join('');
  document.getElementById('primary').innerHTML = navHtml(NAV);
  document.getElementById('utility').innerHTML = navHtml(UTIL);

  const main = document.getElementById('main');
  let route = 'today';
  const render = (keepFocus) => {
    const h = (location.hash || '#today').slice(1);
    route = (V[h] || h.startsWith('project-')) ? h : 'today';
    const owner = ownerOf(route);
    const tabs = owner.tabs ? `<nav class="tabs" aria-label="${owner.l} 하위">${owner.tabs.map(([t, l]) =>
      `<a href="#${t}" ${t === route ? 'aria-current="page"' : ''}>${l}</a>`).join('')}</nav>` : '';
    const body = route.startsWith('project-') ? V.project(route.slice(8)) : V[route]();
    main.innerHTML = `<div class="view">${tabs}${body}</div>`;
    document.querySelectorAll('.nav ul a').forEach((a) => a.dataset.k === owner.k ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
    const w = document.getElementById('writer'); if (w) updateCount(w);
    if (keepFocus && cur != null) main.querySelector(`[data-task="${cur}"]`)?.focus({ preventScroll: true });
  };
  const updateCount = (w) => { const c = document.getElementById('count'); if (c) c.textContent = `${w.value.replace(/\s/g, '').length}자 · 쇼츠 60초는 대략 250자`; };
  window.addEventListener('hashchange', () => { cur = null; render(); window.scrollTo(0, 0); });

  main.addEventListener('click', (e) => {
    const c = e.target.closest('[data-task]'); if (c) return toggleTask(+c.dataset.task);
    const s = e.target.closest('[data-step]');
    if (s) { const k = s.dataset.step; stepState[k] = s.getAttribute('aria-pressed') !== 'true'; render(); main.querySelector(`[data-step="${CSS.escape(k)}"]`)?.focus(); return; }
    if (e.target.id === 'undo' && lastDone) { lastDone.done = false; lastDone = null; statusHtml = ''; render(); return; }
    if (e.target.closest('#toggleDone')) { showDone = !showDone; render(); return; }
    const en = e.target.closest('[data-energy]'); if (en) { energy = +en.dataset.energy; render(); return; }
    const m = e.target.closest('[data-mock]');
    if (m) {
      if (m.dataset.mock === '리뷰 닫기') { reviewSaved = true; render(); return; }
      const st = main.querySelector('.status');
      m.textContent = `${m.dataset.mock} · 목업`;
      if (st) st.textContent = '목업이라 아무것도 보내거나 저장하지 않아요';
    }
    const ch = e.target.closest('.choices button:not([data-energy])');
    if (ch) { ch.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === ch))); }
  });
  main.addEventListener('input', (e) => {
    if (e.target.id === 'writer') { draft = e.target.value; updateCount(e.target); }
    if (e.target.id === 'cap-work') {
      const p = document.getElementById('parse'); const v = e.target.value.trim();
      if (!v) { p.innerHTML = ''; return; }
      const r = parse(v);
      p.innerHTML = `${esc(r.t || '제목 없음')} · ${esc(r.due === undefined ? '기한 없음' : dueLabel(r.due))} · <b>${esc(r.a)}</b>${r.p ? ` ${esc(r.p)}` : ''}${r.imp ? ' · <b>중요</b>' : ''}`;
    }
  });
  main.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && e.target.classList.contains('capture')) { e.target.value = ''; e.target.blur(); return; }
    if (e.key !== 'Enter' || !e.target.classList.contains('capture')) return;
    const v = e.target.value.trim(); if (!v) return;
    if (e.target.id === 'cap-work' || e.target.id === 'cap-today') {
      const r = parse(v); if (!r.t) return;
      const due = r.due === undefined ? (e.target.id === 'cap-today' ? 0 : null) : r.due;
      const x = { id: nextId++, t: r.t, a: r.a, p: r.p, due, imp: r.imp };
      tasks.unshift(x);
      say(`‘${esc(x.t)}’ 추가 · <b>${esc(x.a)}</b> · ${dueLabel(x.due)}`);
      const id = e.target.id; render(); document.getElementById(id)?.focus();
    } else {
      e.target.value = '';
      e.target.placeholder = `“${v}” — 목업이라 저장하지 않았어요`;
    }
  });

  // 키보드: N 추가 · J/K 이동 · X 끝 — 실행 목록에서, 입력 칸 밖에서만
  document.addEventListener('keydown', (e) => {
    if (route !== 'work' || e.target.matches('input, textarea, select, [contenteditable]') || e.metaKey || e.ctrlKey || e.altKey) return;
    const ids = [...main.querySelectorAll('[data-row]')].map((r) => +r.dataset.row);
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); document.getElementById('cap-work')?.focus(); return; }
    if (!ids.length) return;
    const i = ids.indexOf(cur);
    const go = (n) => { cur = ids[n]; main.querySelector(`[data-task="${cur}"]`)?.focus(); };
    if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); go(Math.min(ids.length - 1, i + 1)); }
    else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); go(Math.max(0, i - 1)); }
    else if ((e.key === 'x' || e.key === 'X') && cur != null) { e.preventDefault(); toggleTask(cur); }
  });
  main.addEventListener('focusin', (e) => { const t = e.target.closest('[data-task]'); if (t) cur = +t.dataset.task; });

  const root = document.documentElement;
  const themeBtn = document.getElementById('theme');
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const syncBtn = () => { themeBtn.textContent = isDark() ? '라이트로 보기' : '다크로 보기'; };
  themeBtn.addEventListener('click', () => { root.dataset.theme = isDark() ? 'light' : 'dark'; syncBtn(); });
  syncBtn();
  render();
})();
</script>
</body>
</html>
