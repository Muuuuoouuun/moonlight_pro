<script>
(() => {
  const root=document.getElementById('ml-reference-preview');
  const q=(s)=>root.querySelector(s);
  const seed=JSON.parse(document.getElementById('ml-reference-data').textContent);
  const design={spacing:'comfortable',input:'compact',detail:'side'};
  let records=seed.map(r=>({...r,note:'',star:false,deleted:false}));
  let filter='all',platform='all',query='',selected=null,limit=8,newestId=null,lastDeleted=null;
  let changes={},additions=[],captureDraft='',persistTimer,editingTimer,lastFocused=null,userTouched=false;
  const input=q('#ml-capture'),search=q('#ml-search'),list=q('#ml-list');
  const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icons=()=>{if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}})};
  function applySaved(saved){
    const p=saved?.privateContent;if(!p||p.version!==1)return;
    changes=p.changes||{};additions=Array.isArray(p.additions)?p.additions:[];
    records=[...additions,...seed.map(r=>({...r,note:'',star:false,deleted:false,...(changes[r.id]||{})}))];
    captureDraft=p.captureDraft||'';input.value=captureDraft;query=p.query||'';search.value=query;filter=p.filter||'all';platform=p.platform||'all';
    if(p.design)Object.assign(design,p.design);selected=records.some(r=>r.id===p.selected)?p.selected:null;
  }
  function persist(){
    userTouched=true;clearTimeout(persistTimer);persistTimer=setTimeout(()=>{
      if(!window.openai?.setWidgetState)return;
      const state={modelContent:{view:'reference-capture',spacing:design.spacing,input:design.input,detail:design.detail},privateContent:{version:1,changes,additions,captureDraft:input.value,query,filter,platform,selected,design}};
      if(new TextEncoder().encode(JSON.stringify(state)).length>15000){q('#ml-edit-status').textContent='이 화면에 반영됨 · 다시 열면 복원되지 않을 수 있어요';return}
      window.openai.setWidgetState(state).catch(()=>{});
    },350);
  }
  function track(r){if(r.created){additions=records.filter(x=>x.created)}else{changes[r.id]={title:r.title,note:r.note,star:r.star,deleted:r.deleted}}persist()}
  function active(){return records.find(r=>r.id===selected)}
  function matches(r){
    if(filter==='trash'?!r.deleted:r.deleted)return false;
    if(filter==='star'&&!r.star)return false;if(filter==='curated'&&!r.curated)return false;
    if(platform==='note'&&r.urls.length)return false;
    if(['Instagram','YouTube'].includes(platform)&&!r.platform.startsWith(platform))return false;
    if(platform==='other'&&(!r.urls.length||/^(Instagram|YouTube)/.test(r.platform)))return false;
    const hay=[r.title,r.note,r.summary,r.author,r.platform,...(r.topics||[]),...r.urls].join(' ').toLocaleLowerCase();
    return query.trim().toLocaleLowerCase().split(/\s+/).every(x=>hay.includes(x));
  }
  function renderList(){
    const found=records.filter(matches);q('#ml-count').textContent=`${found.length}건${query?' · 검색 결과':filter==='trash'?' · 휴지통':''}`;
    root.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));
    q('#ml-trash-tab').setAttribute('aria-pressed',String(filter==='trash'));q('#ml-platform').value=platform;q('#ml-clear').hidden=!query;
    list.innerHTML=found.slice(0,limit).map(r=>`<article class="ml-record" data-selected="${r.id===selected}"><button type="button" class="ml-record-open cursor-interaction" data-open="${esc(r.id)}"><span class="ml-record-title">${esc(r.title||'제목 없는 메모')}</span><span class="ml-record-desc">${esc(r.note?'내 메모 · '+r.note:r.summary||'링크만 저장됨')}</span><span class="ml-record-meta"><span>${esc(r.platform)}</span><span>·</span><span>${r.created?'방금 담음':'보관 자료'}</span>${r.curated?'<span>· 선별</span>':''}</span></button><button type="button" class="ml-star cursor-interaction" data-star="${esc(r.id)}" aria-label="${esc(r.title||'메모')} 즐겨찾기" aria-pressed="${r.star}">${r.star?'★':'☆'}</button></article>`).join('');
    if(!found.length){const title=filter==='trash'?'휴지통이 비어 있어요':filter==='star'?'다시 볼 자료에 별을 눌러두세요':query?'찾는 자료가 없어요':'표시할 자료가 없어요';list.innerHTML=`<div class="ml-empty"><h3>${title}</h3><p>${query?'다른 단어로 검색하거나 필터를 바꿔보세요.':'링크나 생각은 정리하지 않고 담아도 괜찮아요.'}</p><button type="button" class="ml-outline cursor-interaction" data-reset-view>전체 자료 보기</button></div>`}
    q('#ml-more').hidden=found.length<=limit;
  }
  function renderDetail(){
    const r=active();root.dataset.detail=String(Boolean(r));q('#ml-detail').hidden=!r;if(!r)return;
    q('#ml-detail-title').value=r.title;q('#ml-detail-note').value=r.note;
    q('#ml-detail-platform').textContent=[r.platform,r.author].filter(Boolean).join(' · ');
    q('#ml-detail-star').textContent=r.star?'★ 즐겨찾기':'☆ 즐겨찾기';q('#ml-detail-star').setAttribute('aria-pressed',String(r.star));
    q('#ml-source-links').innerHTML=r.urls.map((url,i)=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${r.urls.length>1?`원본 ${i+1} 열기`:'원본 열기'} ↗</a>`).join('<br>');q('#ml-source-links').hidden=!r.urls.length;
    q('#ml-detail-summary').textContent=r.summary;q('#ml-summary-section').hidden=!r.summary;
    q('#ml-summary-label').textContent=r.curated?'선별 검토에서 정리한 내용':'보관된 요약';
    q('#ml-coverage-copy').textContent=[r.evidence,r.coverage,'출처의 주장을 독립적으로 사실 검증한 것은 아닙니다.'].filter(Boolean).join('\n\n');q('#ml-coverage').hidden=r.created;
    q('#ml-raw-section').hidden=!r.raw;q('#ml-raw-copy').textContent=r.raw||'';
    q('#ml-detail-origin').textContent=r.created?'이 화면에서 새로 담은 자료':'2026.09.20 정리본';
    q('#ml-delete').textContent=r.deleted?'자료함으로 복원':'휴지통으로';q('#ml-delete').classList.toggle('ml-danger',!r.deleted);
    q('#ml-edit-status').textContent=r.created?'시안에 반영됨':'';
  }
  function openDetail(id){selected=id;lastFocused=root.querySelector(`[data-open="${CSS.escape(id)}"]`);renderList();renderDetail();persist();q('#ml-close').focus({preventScroll:true})}
  function closeDetail(){selected=null;renderList();renderDetail();persist();if(lastFocused){const id=lastFocused.dataset.open;root.querySelector(`[data-open="${CSS.escape(id)}"]`)?.focus()}}
  function feedback(message,id=null,undo=false){const box=q('#ml-capture-feedback');box.replaceChildren();const s=document.createElement('span');s.textContent=message;box.append(s);if(id){const b=document.createElement('button');b.type='button';b.className='ml-outline cursor-interaction';b.textContent='열기';b.onclick=()=>openDetail(id);box.append(b)}if(undo){const b=document.createElement('button');b.type='button';b.className='ml-outline cursor-interaction';b.textContent='실행 취소';b.onclick=()=>{const r=records.find(x=>x.id===lastDeleted);if(r){r.deleted=false;track(r);renderList();feedback('자료함으로 복원했습니다.',r.id)}};box.append(b)}}
  function links(text){return [...new Set((text.match(/https?:\/\/[^\s<>"']+/g)||[]).map(x=>x.replace(/[.,!?;)\]，。]+$/,'')))].filter(x=>{try{return ['https:','http:'].includes(new URL(x).protocol)}catch{return false}})}
  function key(url){try{const u=new URL(url),host=u.hostname.replace(/^www\./,'');if(host==='youtu.be')return 'yt:'+u.pathname.split('/')[1];if(host==='youtube.com'||host==='m.youtube.com'){const id=u.searchParams.get('v')||u.pathname.match(/^\/(shorts|embed)\/([^/]+)/)?.[2];if(id)return 'yt:'+id}if(host==='instagram.com'){const id=u.pathname.match(/^\/(p|reel|reels)\/([^/]+)/)?.[2];if(id)return 'ig:'+id}for(const k of [...u.searchParams.keys()])if(k.startsWith('utm_'))u.searchParams.delete(k);return u.toString()}catch{return url}}
  function platformOf(url){if(!url)return '내 메모';try{const h=new URL(url).hostname.replace(/^www\./,'');return /(^|\.)instagram\.com$/.test(h)?'Instagram':/(^|\.)(youtube\.com|youtu\.be)$/.test(h)?'YouTube':h}catch{return '링크'}}
  function makeRecord(raw,urls){const note=urls.reduce((s,u)=>s.replaceAll(u,''),raw).trim();const title=note.split('\n').find(x=>x.trim())||`${platformOf(urls[0])} 링크`;return {id:'local:'+Date.now()+':'+Math.random().toString(36).slice(2),title:title.slice(0,150),note,raw,urls,platform:platformOf(urls[0]),summary:'',evidence:'',coverage:'',author:'',topics:[],curated:false,star:false,deleted:false,created:true}}
  function doneSave(saved){newestId=saved[0].id;input.value='';captureDraft='';q('#ml-save').disabled=true;q('#ml-choice').hidden=true;renderList();persist();const outside=!matches(saved[0]);feedback(`${saved.length>1?saved.length+'건을 ':''}이 화면에 담았습니다.${outside?' 현재 검색·필터 밖의 자료예요.':''}`,newestId);input.focus({preventScroll:true})}
  function saveNew(raw,urls){const r=makeRecord(raw,urls);records.unshift(r);additions=records.filter(x=>x.created);doneSave([r])}
  function handleCapture(e){e?.preventDefault();const raw=input.value.trim();if(!raw)return;const urls=links(raw),choice=q('#ml-choice');choice.replaceChildren();choice.hidden=true;
    if(urls.length>1){choice.hidden=false;const p=document.createElement('p');p.textContent=`링크 ${urls.length}개가 있어요. 어떻게 담을까요?`;choice.append(p);const split=document.createElement('button');split.type='button';split.className='ml-outline cursor-interaction';split.textContent='링크별로 담기';split.onclick=()=>{const note=urls.reduce((s,u)=>s.replaceAll(u,''),raw).trim();const existing=[];const saved=[];urls.forEach(url=>{const found=records.find(r=>!r.deleted&&r.urls.some(u=>key(u)===key(url)));if(found)existing.push(found);else saved.push(makeRecord(note?[url,note].join('\n'):url,[url]))});records.unshift(...saved);additions=records.filter(x=>x.created);if(saved.length){doneSave(saved);if(existing.length)feedback(`${saved.length}건을 담고 이미 있는 ${existing.length}건은 그대로 두었습니다.`,saved[0].id)}else{choice.hidden=true;feedback('모든 링크가 이미 자료함에 있습니다. 입력한 메모는 남겨두었습니다.',existing[0]?.id)}};const together=document.createElement('button');together.type='button';together.className='cursor-interaction';together.textContent='한 메모로 담기';together.onclick=()=>saveNew(raw,urls);choice.append(split,together);return}
    const old=urls[0]?records.find(r=>!r.deleted&&r.urls.some(u=>key(u)===key(urls[0]))):null;
    if(old){choice.hidden=false;const p=document.createElement('p');p.textContent=`이미 담은 링크예요 · ${old.title}`;choice.append(p);const open=document.createElement('button');open.type='button';open.className='ml-outline cursor-interaction';open.textContent='기존 자료 열기';open.onclick=()=>openDetail(old.id);choice.append(open);const memo=urls.reduce((s,u)=>s.replaceAll(u,''),raw).trim();if(memo){const append=document.createElement('button');append.type='button';append.className='ml-outline cursor-interaction';append.textContent='메모 덧붙이기';append.onclick=()=>{old.note=[old.note,memo].filter(Boolean).join('\n\n');track(old);doneSave([old]);if(selected===old.id)renderDetail()};choice.append(append)}const separate=document.createElement('button');separate.type='button';separate.className='cursor-interaction';separate.textContent='별도로 담기';separate.onclick=()=>saveNew(raw,urls);choice.append(separate);return}
    saveNew(raw,urls);
  }
  q('#ml-capture-form').addEventListener('submit',handleCapture);
  q('#ml-save').addEventListener('click',handleCapture);
  input.addEventListener('input',()=>{q('#ml-capture-feedback').replaceChildren();q('#ml-save').disabled=!input.value.trim();q('#ml-choice').hidden=true;persist()});
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&!e.isComposing){e.preventDefault();handleCapture()}});
  search.addEventListener('input',()=>{query=search.value;limit=8;renderList();persist()});
  q('#ml-clear').onclick=()=>{query='';search.value='';renderList();persist();search.focus()};
  q('#ml-filter-toggle').onclick=()=>{const p=q('#ml-filters');p.hidden=!p.hidden;q('#ml-filter-toggle').setAttribute('aria-expanded',String(!p.hidden))};
  q('#ml-platform').onchange=e=>{platform=e.target.value;limit=8;renderList();persist()};
  root.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;limit=8;renderList();persist()});
  q('#ml-trash-tab').onclick=()=>{filter=filter==='trash'?'all':'trash';limit=8;renderList();persist()};
  q('#ml-more').onclick=()=>{limit+=8;renderList()};
  list.addEventListener('click',e=>{const open=e.target.closest('[data-open]'),star=e.target.closest('[data-star]');if(open)openDetail(open.dataset.open);if(star){const r=records.find(x=>x.id===star.dataset.star);r.star=!r.star;track(r);renderList();if(selected===r.id)renderDetail()}if(e.target.closest('[data-reset-view]')){filter='all';platform='all';query='';search.value='';renderList();persist()}});
  q('#ml-close').onclick=closeDetail;
  q('#ml-detail-star').onclick=()=>{const r=active();r.star=!r.star;track(r);renderList();renderDetail()};
  for(const [selector,field] of [['#ml-detail-title','title'],['#ml-detail-note','note']])q(selector).addEventListener('input',e=>{const r=active();if(!r)return;r[field]=e.target.value;track(r);renderList();q('#ml-edit-status').textContent='변경 중…';clearTimeout(editingTimer);editingTimer=setTimeout(()=>q('#ml-edit-status').textContent='이 화면에 반영됨',450)});
  q('#ml-delete').onclick=()=>{const r=active();r.deleted=!r.deleted;lastDeleted=r.deleted?r.id:null;track(r);const deleted=r.deleted;closeDetail();feedback(deleted?'휴지통으로 옮겼습니다.':'자료함으로 복원했습니다.',deleted?null:r.id,deleted)};
  root.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected){e.preventDefault();closeDetail()}if(e.key.toLowerCase()==='n'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)&&!selected){e.preventDefault();input.focus()}});
  function applyDesign(){root.style.setProperty('--ml-row-pad',design.spacing==='compact'?'10px':'16px');input.rows=design.input==='roomy'?4:2;root.dataset.detailMode=design.detail}
  applySaved(window.openai?.widgetState);applyDesign();renderList();renderDetail();q('#ml-save').disabled=!input.value.trim();icons();
  window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState;if(saved&&!userTouched){applySaved(saved);applyDesign();renderList();renderDetail()}});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{applyDesign();persist()}});tweak.addSelect(design,'spacing',{label:'목록 간격',options:[{label:'여유 있게',value:'comfortable'},{label:'촘촘하게',value:'compact'}]});tweak.addSelect(design,'input',{label:'입력란',options:[{label:'짧게 시작',value:'compact'},{label:'넉넉하게',value:'roomy'}]});tweak.addSelect(design,'detail',{label:'데스크톱 상세',options:[{label:'목록 옆에서',value:'side'},{label:'상세에 집중',value:'replace'}]})}
})();
</script>
