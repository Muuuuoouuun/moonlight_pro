name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Contract checks
        run: npm run check:contracts

      - name: ClassIn sales checks
        run: npm run check:classin

      - name: Tests
        run: npm test

      - name: Desktop tests
        run: npm --workspace @com-moon/desktop test

      - name: Hub and Engine build
        run: npm run build -- --filter=@com-moon/hub --filter=@com-moon/engine

      - name: Audit high severity
        run: npm audit --omit=dev --audit-level=high
