<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'">
<title>Moonlight 집중</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="focus.css">
</head>
<body>
<main class="shield" id="shield">
  <div class="stack" id="stack">
    <img class="perched" id="perched" alt="">
    <section class="card" aria-label="집중 타이머">
      <div class="lock"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg><span>집중 중</span></div>
      <div class="timer" id="timer" role="timer" aria-live="off">00:00</div>
      <div class="caption">지금은 한 가지에만 집중해요.</div>
      <div class="progress" id="progress" role="progressbar" aria-label="집중 진행" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar"></i></div>
      <div class="controls" id="controls"></div>
    </section>
    <div class="hint" id="hint"><kbd>Esc</kbd><span>1.3초 길게 누르면 중지 확인</span><i class="hold" id="hold" aria-hidden="true"></i></div>
  </div>
  <div class="minimal" id="minimal" hidden>Moonlight 집중 중</div>
</main>
<script src="core/contract-begin.js"></script>
<script src="../shared/contract.js"></script>
<script src="core/contract-end.js"></script>
<script src="model/platform.js"></script>
<script src="model/focus-model.js"></script>
<script src="core/bridge.js"></script>
<script src="focus-screen.js"></script>
</body>
</html>
